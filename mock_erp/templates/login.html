<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CentrAlign ERP - Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-800 rounded-xl shadow-2xl border border-slate-700 p-8">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-indigo-600 text-white font-bold text-2xl mb-3 shadow-lg shadow-indigo-500/30">
                CA
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">CentrAlign Enterprise ERP</h1>
            <p class="text-sm text-slate-400 mt-1">Internal Financial & Accounts Payable Portal</p>
        </div>

        {% if error %}
        <div id="error-banner" class="mb-5 p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-sm flex items-center gap-2">
            <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-5" id="login-form">
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Username</label>
                <input type="text" id="username" name="username" required placeholder="admin"
                    class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white placeholder-slate-500 outline-none transition">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••"
                    class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white placeholder-slate-500 outline-none transition">
            </div>

            <div class="flex items-center justify-between text-xs text-slate-400">
                <span class="text-slate-500">Default: admin / company_secure_pass</span>
            </div>

            <button type="submit" id="btn-login"
                class="w-full py-3 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium shadow-lg shadow-indigo-600/30 transition duration-150 ease-in-out cursor-pointer">
                Sign In to Portal
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-700 text-center text-xs text-slate-500">
            Automated Agent Sandbox Mode • Status: Active
        </div>
    </div>
</body>
</html>
