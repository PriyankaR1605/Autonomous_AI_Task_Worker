<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CentrAlign ERP - Register New Invoice</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <!-- Top Navigation -->
    <header class="bg-slate-800 border-b border-slate-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/dashboard" class="flex items-center gap-2 text-slate-300 hover:text-white transition">
                    <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-md">
                        CA
                    </div>
                    <span class="font-bold text-lg text-white">CentrAlign ERP</span>
                </a>
            </div>
            <div class="text-xs text-slate-400">
                <a href="/dashboard" class="hover:text-indigo-400 transition">← Back to Ledger</a>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-2xl p-8">
            <div class="mb-8">
                <h1 class="text-2xl font-bold text-white">Register Incoming Invoice</h1>
                <p class="text-sm text-slate-400 mt-1">Enter extracted vendor billing details into the company financial system.</p>
            </div>

            {% if error %}
            <div id="form-error-banner" class="mb-6 p-4 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-300 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form action="/invoices/new" method="POST" id="invoice-entry-form" class="space-y-6">
                <!-- Vendor Name -->
                <div>
                    <label for="vendor_name" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
                        Vendor / Company Name <span class="text-rose-400">*</span>
                    </label>
                    <input type="text" id="vendor_name" name="vendor_name" required placeholder="e.g. Company X"
                        class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white placeholder-slate-500 outline-none transition">
                </div>

                <!-- Invoice Number & Currency -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="invoice_number" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
                            Invoice Number <span class="text-rose-400">*</span>
                        </label>
                        <input type="text" id="invoice_number" name="invoice_number" required placeholder="e.g. INV-2026-9901"
                            class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white placeholder-slate-500 outline-none transition">
                    </div>
                    <div>
                        <label for="currency" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
                            Currency
                        </label>
                        <select id="currency" name="currency"
                            class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white outline-none transition">
                            <option value="USD" selected>USD - US Dollar ($)</option>
                            <option value="EUR">EUR - Euro (€)</option>
                            <option value="GBP">GBP - British Pound (£)</option>
                            <option value="CAD">CAD - Canadian Dollar ($)</option>
                        </select>
                    </div>
                </div>

                <!-- Total Amount & Due Date -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="amount" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
                            Total Amount Due <span class="text-rose-400">*</span>
                        </label>
                        <input type="number" step="0.01" id="amount" name="amount" required placeholder="0.00"
                            class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white placeholder-slate-500 outline-none transition font-mono">
                    </div>
                    <div>
                        <label for="due_date" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
                            Payment Due Date <span class="text-rose-400">*</span>
                        </label>
                        <input type="date" id="due_date" name="due_date" required
                            class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white outline-none transition font-mono">
                    </div>
                </div>

                <!-- Notes / Extraction Remarks -->
                <div>
                    <label for="notes" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">
                        Notes & Processing Metadata
                    </label>
                    <textarea id="notes" name="notes" rows="3" placeholder="Processed autonomously by AI Task Worker..."
                        class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-white placeholder-slate-500 outline-none transition text-sm"></textarea>
                </div>

                <!-- Actions -->
                <div class="pt-4 border-t border-slate-700 flex items-center justify-end gap-3">
                    <a href="/dashboard" id="btn-cancel" class="px-5 py-2.5 rounded-lg border border-slate-700 hover:bg-slate-700 text-slate-300 text-sm font-medium transition">
                        Cancel
                    </a>
                    <button type="submit" id="btn-submit-invoice"
                        class="px-6 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm shadow-lg shadow-indigo-600/30 transition">
                        Confirm & Record Invoice
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
