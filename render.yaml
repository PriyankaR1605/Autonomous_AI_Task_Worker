services:
  - type: web
    name: autonomous-ai-task-worker
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8501
      - key: HEADLESS_BROWSER
        value: "true"
      - key: STEP_DELAY_SECONDS
        value: "1.5"
      - key: PUBLIC_BASE_URL
        value: "https://autonomous-ai-task-worker.onrender.com"
